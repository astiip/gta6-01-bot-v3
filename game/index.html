<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NEON HARBOR: RAIN HEIST — Meridian Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a16; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #e8f4ff; z-index: 5; }
  #hud-tl { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 6px #000; }
  #wanted { font-size: 26px; letter-spacing: 4px; }
  #money { font-size: 26px; font-weight: 800; color: #7CFC98; margin-top: 2px; }
  #respect { margin-top: 4px; font-size: 13px; letter-spacing: 2px; font-weight: 700; }
  #respect-bar { width: 150px; height: 5px; background: rgba(255,255,255,.18); margin-top: 3px; border-radius: 3px; overflow: hidden; }
  #respect-bar i { display: block; height: 100%; background: #37e6ff; width: 0%; }
  #hud-tr { position: absolute; top: 14px; right: 16px; text-align: right; }
  #minimap { border: 2px solid rgba(55,230,255,.55); border-radius: 6px; background: #0a0f1a; box-shadow: 0 0 18px rgba(55,230,255,.25); }
  #map-label { font-size: 11px; letter-spacing: 3px; color: #8fa3b8; margin-top: 3px; }
  #hud-pd { position: absolute; left: 16px; bottom: 16px; width: 300px; background: rgba(5,8,16,.72); border: 1px solid rgba(55,230,255,.35); border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(2px); }
  #pd-title { font-size: 11px; letter-spacing: 3px; color: #37e6ff; font-weight: 800; margin-bottom: 6px; }
  .pd-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; color: #cfe0ef; }
  .pd-row span:last-child { color: #ffb02e; }
  #chatter { margin-top: 7px; font-size: 12px; font-style: italic; color: #9fd8ff; min-height: 16px; }
  #hud-bc { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: 560px; max-width: 92vw; text-align: center; }
  #dialog { opacity: 0; transition: opacity .4s; background: rgba(5,8,16,.78); border: 1px solid rgba(255,46,136,.5); border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; }
  #dialog-title { font-size: 17px; font-weight: 900; letter-spacing: 2px; color: #ff2e88; }
  #dialog-text { font-size: 13px; color: #dfeaf5; margin-top: 3px; line-height: 1.45; }
  #say { font-size: 15px; font-weight: 600; text-shadow: 0 1px 6px #000, 0 0 12px rgba(55,230,255,.6); min-height: 20px; }
  #prompt { font-size: 13px; color: #ffe9a8; text-shadow: 0 1px 4px #000; min-height: 18px; margin-top: 2px; }
  #progress { opacity: 0; transition: opacity .2s; height: 10px; background: rgba(255,255,255,.15); border-radius: 5px; margin-top: 6px; position: relative; overflow: hidden; }
  #progress-fill { height: 100%; background: linear-gradient(90deg, #37e6ff, #ff2e88); width: 0%; }
  #progress-label { position: absolute; inset: 0; font-size: 10px; letter-spacing: 2px; line-height: 10px; color: #fff; text-shadow: 0 1px 3px #000; }
  #hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; text-shadow: 0 1px 6px #000; }
  #speed { font-size: 34px; font-weight: 900; }
  #speed small { font-size: 12px; letter-spacing: 2px; }
  #weapon { font-size: 13px; letter-spacing: 3px; color: #ffb02e; font-weight: 700; }
  #radio { font-size: 12px; letter-spacing: 2px; color: #37e6ff; margin-top: 2px; }
  #controls-hint { font-size: 10px; color: #8fa3b8; margin-top: 8px; letter-spacing: .5px; }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,20,40,.55) 100%); }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(4,6,14,.82), rgba(4,6,14,.94)); pointer-events: auto; padding: 20px; }
  #screen-title { display: flex; }
  .screen h1 { font-size: 54px; margin: 0; letter-spacing: 8px; color: #37e6ff; text-shadow: 0 0 24px rgba(55,230,255,.8), 0 0 60px rgba(255,46,136,.5); }
  .screen h2 { font-size: 30px; margin: 2px 0 14px; letter-spacing: 12px; color: #ff2e88; text-shadow: 0 0 20px rgba(255,46,136,.8); }
  .screen .tag { font-size: 16px; color: #ffe9a8; letter-spacing: 1px; }
  .screen .story { max-width: 620px; font-size: 15px; line-height: 1.6; color: #dfeaf5; }
  .screen .cta { font-size: 17px; font-weight: 800; letter-spacing: 3px; color: #7CFC98; margin-top: 18px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .screen .keys { font-size: 12px; line-height: 1.8; color: #8fa3b8; }
  #save-line { font-size: 13px; color: #37e6ff; }
  #over-text { max-width: 560px; font-size: 15px; line-height: 1.6; color: #dfeaf5; }
  #garage-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; width: 520px; max-width: 92vw; }
  .garage-btn { pointer-events: auto; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(55,230,255,.08); border: 1px solid rgba(55,230,255,.4); color: #e8f4ff; border-radius: 8px; padding: 12px 16px; font-family: inherit; text-align: left; }
  .garage-btn:hover { background: rgba(55,230,255,.18); }
  .garage-btn b { letter-spacing: 1px; }
  .garage-btn span { font-size: 12px; color: #9fb4c8; flex: 1; }
  .garage-btn em { font-style: normal; font-size: 13px; color: #7CFC98; font-weight: 700; white-space: nowrap; }
  #garage-money { font-size: 16px; color: #7CFC98; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" aria-label="NEON HARBOR: RAIN HEIST — drive Mara Voss through a rainy neon city, rob the Meridian Vault, lose the MBPD and escape by boat at Pier 9"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
